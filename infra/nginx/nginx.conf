worker_processes auto;
events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  gzip on;
  gzip_types application/json text/css application/javascript;

  limit_req_zone $binary_remote_addr zone=eval:10m rate=100r/s;
  limit_req_zone $binary_remote_addr zone=admin:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

  upstream backend_upstream {
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=10s keepalive 64;
  }

  upstream frontend_upstream {
    server frontend:80 max_fails=3 fail_timeout=10s keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    location /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    location /api/v1/auth/ {
      limit_req zone=auth burst=20 nodelay;
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 500ms;
      proxy_read_timeout 2s;
    }

    location /api/v1/flags/evaluate {
      limit_req zone=eval burst=200 nodelay;
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 250ms;
      proxy_read_timeout 1s;
    }

    location /api/ {
      limit_req zone=admin burst=50 nodelay;
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://frontend_upstream;
    }
  }
}
